<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery Bulk Assigner — Masters Window Tinting</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:"Inter",system-ui,sans-serif;font-size:14px}
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:#111;border-bottom:1px solid #222;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top h1{font-size:1rem;font-weight:700;letter-spacing:.04em}
.top-right{display:flex;gap:10px;align-items:center}
.btn{padding:9px 18px;border-radius:4px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn:hover{background:#222;border-color:#555}
.btn-green{background:#1a4a1a;border-color:#2d7a2d;color:#5dfc5d}
.btn-green:hover{background:#1f5a1f}
.btn-blue{background:#1a2a4a;border-color:#2d4a7a;color:#5da0fc}
.main{display:grid;grid-template-columns:1fr 320px;height:100vh;padding-top:56px}

/* LEFT — image pool */
.pool{overflow-y:auto;padding:20px;border-right:1px solid #1a1a1a}
.pool-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.pool-title{font-weight:700;font-size:.9rem;color:#aaa;letter-spacing:.08em;text-transform:uppercase}
.pool-controls{display:flex;gap:8px;align-items:center}
.search{background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:7px 12px;border-radius:4px;font-size:13px;width:200px}
.search:focus{outline:none;border-color:#444}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.img-item{position:relative;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:.15s;aspect-ratio:4/3;background:#1a1a1a}
.img-item img{width:100%;height:100%;object-fit:cover;display:block}
.img-item .name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);font-size:.55rem;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ccc}
.img-item.selected{border-color:#fff;}
.img-item.selected::after{content:"✓";position:absolute;top:4px;right:4px;background:#fff;color:#000;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800}
.img-item.assigned{opacity:.35;border-color:#2d7a2d}
.img-item.assigned::before{content:"✓ done";position:absolute;top:4px;left:4px;background:#2d7a2d;color:#fff;font-size:.55rem;padding:2px 5px;border-radius:3px}
.sel-count{font-size:.75rem;color:#aaa}

/* RIGHT — category buckets */
.sidebar{overflow-y:auto;background:#0d0d0d}
.sidebar-header{padding:16px 16px 8px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#666;border-bottom:1px solid #1a1a1a}
.cat-bucket{border-bottom:1px solid #1a1a1a;transition:.2s}
.cat-bucket.drag-over{background:#1a2a1a}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer}
.cat-head:hover{background:#151515}
.cat-name{font-weight:600;font-size:.82rem}
.cat-count{font-size:.7rem;background:#222;padding:2px 8px;border-radius:99px;color:#aaa}
.cat-assign{background:#1a3a1a;border:1px solid #2d5a2d;color:#5dfc5d;padding:5px 12px;border-radius:4px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap}
.cat-assign:hover{background:#1f4a1f}
.cat-imgs{padding:0 12px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;display:none}
.cat-bucket.open .cat-imgs{display:grid}
.cat-thumb{aspect-ratio:4/3;border-radius:3px;overflow:hidden;position:relative;background:#1a1a1a}
.cat-thumb img{width:100%;height:100%;object-fit:cover}
.cat-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(255,80,80,.9);border:none;color:#fff;width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:.6rem;display:flex;align-items:center;justify-content:center;line-height:1}

/* status bar */
.status{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;font-size:.78rem;color:#888}
.status b{color:#fff}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="top h1" style="font-size:1rem;font-weight:700">🖼 Gallery Bulk Assigner</div>
    <div style="font-size:.7rem;color:#666;margin-top:2px">Masters Window Tinting · Assign images to categories</div>
  </div>
  <div class="top-right">
    <span id="sel-info" class="sel-count">0 selected</span>
    <button class="btn" onclick="selectAll()">☑ Select All</button>
    <button class="btn" onclick="deselectAll()">☐ Clear</button>
    <button class="btn btn-green" onclick="publishAll()">🚀 Publish to Site</button>
  </div>
</div>

<div class="main">
  <!-- LEFT: image pool -->
  <div class="pool">
    <div class="pool-header">
      <span class="pool-title">All Cloudinary Images (<span id="pool-count">0</span>)</span>
      <div class="pool-controls">
        <input class="search" type="text" placeholder="Search images..." oninput="filterImgs(this.value)">
      </div>
    </div>
    <div class="img-grid" id="imgGrid"></div>
  </div>

  <!-- RIGHT: category buckets -->
  <div class="sidebar">
    <div class="sidebar-header">Gallery Categories</div>
    <div id="catList"></div>
    <div style="padding:16px">
      <button class="btn btn-green" style="width:100%;justify-content:center" onclick="publishAll()">🚀 Publish All to Site</button>
    </div>
  </div>
</div>

<div class="status">
  <span id="status-msg">Ready · Select images on the left, then click a category's <b>Add Selected</b> button</span>
  <span><b id="total-assigned">0</b> total images assigned</span>
</div>

he_tatoca.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780774293/ceramicporsche_tatoca.jpg", "name": "ceramicporsche"}, {"id": "ceramicbluemustang3_sn3v6m", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780774292/ceramicbluemustang3_sn3v6m.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780774292/ceramicbluemustang3_sn3v6m.jpg", "name": "ceramicbluemustang3"}, {"id": "ceramicbluemustang2_zlz2w2", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780774292/ceramicbluemustang2_zlz2w2.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780774292/ceramicbluemustang2_zlz2w2.jpg", "name": "ceramicbluemustang2"}, {"id": "camerotint_e1xqmj", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780774292/camerotint_e1xqmj.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780774292/camerotint_e1xqmj.jpg", "name": "camerotint"}, {"id": "20211108-120511_ldm71n", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780774291/20211108-120511_ldm71n.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780774291/20211108-120511_ldm71n.jpg", "name": "20211108-120511"}, {"id": "Bonneville1_vliddv", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780774291/Bonneville1_vliddv.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780774291/Bonneville1_vliddv.jpg", "name": "Bonneville1"}, {"id": "13886892-1247704235240769-7245070594656095034-n_tuo5ji", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780774291/13886892-1247704235240769-7245070594656095034-n_tuo5ji.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780774291/13886892-1247704235240769-7245070594656095034-n_tuo5ji.jpg", "name": "13886892-1247704235240769-7245070594656095034-n"}, {"id": "main-sample", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780451154/main-sample.png", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780451154/main-sample.png", "name": "main-sample"}, {"id": "sample", "url": "https://res.cloudinary.com/dym8x61sp/image/upload/v1780451131/sample.jpg", "thumb": "https://res.cloudinary.com/dym8x61sp/image/upload/w_200,h_150,c_fill/v1780451131/sample.jpg", "name": "sample"}];
const CATS     = ["Window Tinting", "Liquid PPF", "Ceramic Coating", "Residential Tinting", "Commercial Tinting", "Wall Graphics", "Detailing & Paint Correction", "Exotic & Classic Cars"];
const PUBLISH_URL = '/api/publish';
const GH_RAW = 'https://raw.githubusercontent.com/austriaalvinnoel/masters-window-tinting/main/cms-data.json';

let selected  = new Set();
let gallery   = {};
let filtered  = [...ALL_IMGS];
let cmsData   = {};

// Init categories
CATS.forEach(cat => gallery[cat] = []);

// Load existing CMS data first
async function init() {
  setStatus('Loading existing gallery data...');
  try {
    const r = await fetch(GH_RAW + '?t=' + Date.now());
    cmsData = await r.json();
    if (cmsData.gallery) {
      gallery = cmsData.gallery;
      // Make sure all cats exist
      CATS.forEach(cat => { if (!gallery[cat]) gallery[cat] = []; });
    }
  } catch(e) { console.warn('Could not load CMS data', e); }
  renderImgs();
  renderCats();
  setStatus('Ready · ' + ALL_IMGS.length + ' images loaded from Cloudinary');
}

function isAssigned(img) {
  return Object.values(gallery).some(urls => urls.includes(img.url));
}

function renderImgs() {
  const grid = document.getElementById('imgGrid');
  document.getElementById('pool-count').textContent = filtered.length;
  grid.innerHTML = filtered.map(img => {
    const sel  = selected.has(img.id);
    const done = isAssigned(img);
    return `<div class="img-item${sel?' selected':''}${done?' assigned':''}" 
      onclick="toggleSelect('${img.id}')" title="${img.name}">
      <img src="${img.thumb}" loading="lazy">
      <div class="name">${img.name}</div>
    </div>`;
  }).join('');
  document.getElementById('sel-info').textContent = selected.size + ' selected';
}

function renderCats() {
  const list = document.getElementById('catList');
  let totalAssigned = 0;
  list.innerHTML = CATS.map(cat => {
    const urls = gallery[cat] || [];
    totalAssigned += urls.length;
    const thumbs = urls.slice(-6).map(url => {
      const thumb = url.replace('/upload/', '/upload/w_100,h_75,c_fill/');
      return `<div class="cat-thumb">
        <img src="${thumb}" loading="lazy">
        <button class="rm" onclick="removeFromCat('${cat}','${url}')" title="Remove">×</button>
      </div>`;
    }).join('');
    return `<div class="cat-bucket" id="bucket-${cat.replace(/[^a-z]/gi,'_')}">
      <div class="cat-head" onclick="toggleBucket('${cat}')">
        <span class="cat-name">${cat}</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="cat-count">${urls.length}</span>
          <button class="cat-assign" onclick="event.stopPropagation();addSelected('${cat}')" title="Add selected images to ${cat}">
            + Add Selected
          </button>
        </div>
      </div>
      <div class="cat-imgs">${thumbs}</div>
    </div>`;
  }).join('');
  document.getElementById('total-assigned').textContent = totalAssigned;
}

function toggleBucket(cat) {
  const el = document.getElementById('bucket-' + cat.replace(/[^a-z]/gi,'_'));
  if (el) el.classList.toggle('open');
}

function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  renderImgs();
}

function selectAll() {
  filtered.forEach(img => selected.add(img.id));
  renderImgs();
}

function deselectAll() {
  selected.clear();
  renderImgs();
}

function filterImgs(q) {
  q = q.toLowerCase();
  filtered = q ? ALL_IMGS.filter(img => img.name.toLowerCase().includes(q)) : [...ALL_IMGS];
  renderImgs();
}

function addSelected(cat) {
  if (selected.size === 0) { alert('Select some images first!'); return; }
  if (!gallery[cat]) gallery[cat] = [];
  let added = 0;
  const existing = new Set(gallery[cat]);
  selected.forEach(id => {
    const img = ALL_IMGS.find(i => i.id === id);
    if (img && !existing.has(img.url)) {
      gallery[cat].push(img.url);
      existing.add(img.url);
      added++;
    }
  });
  selected.clear();
  renderImgs();
  renderCats();
  // Open this bucket
  const el = document.getElementById('bucket-' + cat.replace(/[^a-z]/gi,'_'));
  if (el) el.classList.add('open');
  setStatus('✅ Added ' + added + ' images to ' + cat + ' · Click 🚀 Publish when ready');
}

function removeFromCat(cat, url) {
  gallery[cat] = (gallery[cat] || []).filter(u => u !== url);
  renderCats();
  renderImgs();
  setStatus('Removed image from ' + cat);
}

async function publishAll() {
  setStatus('⏳ Publishing to GitHub...');
  const publishKey = localStorage.getItem('cms_publish_key');
  if (!publishKey) {
    const key = prompt('Enter your CMS Publish Key (from admin Settings):');
    if (!key) return;
    localStorage.setItem('cms_publish_key', key);
  }
  
  try {
    const payload = {
      ...cmsData,
      gallery: gallery,
      publishedAt: new Date().toISOString()
    };
    const r = await fetch(PUBLISH_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-cms-key': localStorage.getItem('cms_publish_key')},
      body: JSON.stringify({ payload, message: 'CMS: Bulk gallery assignment' })
    });
    if (r.ok) {
      setStatus('✅ Published! Gallery is live on your website.');
      // Update localStorage too
      localStorage.setItem('cms_gallery', JSON.stringify(gallery));
    } else {
      const err = await r.text();
      setStatus('❌ Publish failed: ' + err);
    }
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  }
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

init();
</script>
