name: Temporary Visual Polish
on:
  push:
    branches:
      - agent/visual-polish-2026-08-20
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-polish-2026-08-20
      - name: Link visual polish stylesheet
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='</head>'
          link='<link rel="stylesheet" href="/visual-polish.css">\n'
          if link not in s:
              if needle not in s: raise SystemExit('head closing tag not found')
              s=s.replace(needle,link+needle,1)
              p.write_text(s,encoding='utf-8')
      - name: Commit homepage link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Link subtle homepage visual polish"
          git push origin HEAD:agent/visual-polish-2026-08-20
