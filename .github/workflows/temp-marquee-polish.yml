name: Temporary Marquee Polish

on:
  push:
    branches:
      - agent/marquee-polish-2026-08-20
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch-marquee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marquee-polish-2026-08-20

      - name: Apply subtle brand-aligned marquee polish
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = '''.marquee{display:flex;overflow:hidden;user-select:none;border-bottom:1px solid var(--line);background:#050505}
.marquee.bottom{border-bottom:0;border-top:1px solid var(--line)}
.marquee-inner{display:flex;width:max-content;animation:scroll-l 28s linear infinite}
.marquee.bottom .marquee-inner{animation-name:scroll-r}
.marquee .track{display:flex;align-items:center;gap:46px;padding:16px 0;white-space:nowrap}
.marquee span{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#fff;display:inline-flex;align-items:center;gap:46px}
.marquee span::after{content:"◆";color:var(--gold);font-size:9px}'''

          new = '''.marquee{
  position:relative;display:flex;overflow:hidden;user-select:none;
  border-bottom:1px solid rgba(232,185,35,.22);
  background:linear-gradient(180deg,#090909 0%,#030303 100%);
  box-shadow:inset 0 1px rgba(255,255,255,.025),inset 0 -1px rgba(0,0,0,.65);
}
.marquee::before,.marquee::after{
  content:"";position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none;
}
.marquee::before{left:0;background:linear-gradient(90deg,#050505,transparent)}
.marquee::after{right:0;background:linear-gradient(270deg,#050505,transparent)}
.marquee.bottom{border-bottom:0;border-top:1px solid rgba(232,185,35,.22)}
.marquee-inner{display:flex;width:max-content;animation:scroll-l 34s linear infinite;will-change:transform}
.marquee.bottom .marquee-inner{animation-name:scroll-r}
.marquee .track{display:flex;align-items:center;gap:42px;padding:14px 0;white-space:nowrap}
.marquee span{
  font-family:var(--body);font-weight:600;font-size:14px;line-height:1;
  letter-spacing:.16em;text-transform:uppercase;color:#f5f5f5;
  display:inline-flex;align-items:center;gap:42px;
  text-shadow:0 1px 12px rgba(255,255,255,.04);
}
.marquee span::after{content:"◆";color:var(--gold);font-size:8px;filter:drop-shadow(0 0 5px rgba(232,185,35,.22))}
@media(hover:hover){.marquee:hover .marquee-inner{animation-play-state:paused}}'''

          if old not in text:
              raise SystemExit("Expected marquee CSS block was not found; refusing to make a broad edit.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          text = path.read_text(encoding="utf-8")
          text = text.replace('.marquee span{font-size:13px}', '.marquee span{font-size:13px;letter-spacing:.13em}.marquee::before,.marquee::after{width:34px}', 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit website change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish homepage marquee with brand-aligned styling"
          git push origin HEAD:agent/marquee-polish-2026-08-20
